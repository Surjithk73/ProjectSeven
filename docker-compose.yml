name: apishield-demo

x-python: &python
  image: apishield-demo-python
  build: .
  working_dir: /app
  environment:
    API_BASE: http://mock_provider:8001
    PROVIDER_URL: http://mock_provider:8001
    BFF_URL: http://swiftpay_bff:8003
    API_VERSION: v1
    OASDIFF_BIN: /usr/local/bin/oasdiff
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
  # Shared repaired source and evidence are visible to all Python services.
  volumes:
    - ./client_app:/app/client_app
    - ./sig_engine:/app/sig_engine
    - ./agent:/app/agent

services:
  mock_provider:
    <<: *python
    command: [uvicorn, mock_provider.main:app, --host, 0.0.0.0, --port, '8001']
    ports: ['127.0.0.1:8001:8001']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/version', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  swiftpay_bff:
    <<: *python
    command: [uvicorn, client_app.server:app, --host, 0.0.0.0, --port, '8003']
    ports: ['127.0.0.1:8003:8003']
    depends_on:
      mock_provider:
        condition: service_healthy
  dashboard:
    <<: *python
    command: [uvicorn, dashboard_api:app, --host, 0.0.0.0, --port, '8002']
    ports: ['127.0.0.1:8002:8002']
    depends_on:
      mock_provider:
        condition: service_healthy
      swiftpay_bff:
        condition: service_started
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:5173']
    depends_on: [dashboard]
  swiftpay_frontend:
    build: ./swiftpay_frontend
    ports: ['127.0.0.1:5174:5174']
    depends_on: [swiftpay_bff]
