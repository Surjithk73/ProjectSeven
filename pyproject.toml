[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apishield-local"
version = "0.2.0"
description = "Commit-pinned local analysis and validated repair proposals for Python API integrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["google-genai==2.22.0"]

[project.scripts]
apishield = "apishield.cli:main"

[tool.setuptools]
packages = ["apishield"]

[tool.pytest.ini_options]
testpaths = ["tests", "client_app/tests"]
